# PostgreSQL dedicado al desarrollo de MYDAS PULSO.
# Credenciales de ejemplo, solo para desarrollo local.
# Uso: docker compose up -d   ·   detener: docker compose stop
services:
  postgres:
    image: postgres:18-alpine
    container_name: mydas-pulso-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulso
      POSTGRES_PASSWORD: pulso
      POSTGRES_DB: mydas_pulso
    ports:
      # Si ya tienes PostgreSQL local en 5432: POSTGRES_PORT=5433 docker compose up -d
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pulso-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pulso -d mydas_pulso']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pulso-postgres-data:
